name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE.txt
      - Dockerfile
      - .dockerignore
  workflow_dispatch:

# Cancel a run when a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / ActiveRecord ${{ matrix.activerecord }}
    strategy:
      fail-fast: false
      # Oldest and newest of each, paired so every Ruby and ActiveRecord release is covered.
      # ActiveRecord 8.0+ requires Ruby >= 3.2.
      matrix:
        include:
          - { ruby: "3.1", activerecord: "7.1" }
          - { ruby: "3.2", activerecord: "7.2" }
          - { ruby: "3.3", activerecord: "8.0" }
          - { ruby: "3.4", activerecord: "8.1" }
    env:
      ACTIVERECORD_VERSION: ${{ matrix.activerecord }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
