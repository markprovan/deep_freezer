name: Release

# Publishes to RubyGems using trusted publishing (OIDC), so no API key is stored.
# Trigger by creating a release in the GitHub UI (which creates the tag) or pushing a tag
# matching the version in lib/deep_freezer/version.rb, e.g. v2.0.0.
# The GitHub release itself is created by hand, not by this workflow.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # release-gem pushes the version tag if it is missing
      id-token: write # RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Check tag matches gem version
        run: |
          version=$(ruby -r./lib/deep_freezer/version -e 'puts DeepFreezer::VERSION')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gem version v$version" >&2
            exit 1
          fi

      - run: bundle exec rake

      - uses: rubygems/release-gem@v1
